<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>王者1v1 - 峡谷对决</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#0a0a14;
    display:flex; align-items:center; justify-content:center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
  }
  #gameCanvas { display:block; width:100%; height:100%; }
  
  /* UI 层 */
  #uiLayer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  
  /* 顶部血条 */
  .top-bar { position:absolute; top:15px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 15px; align-items:center; }
  .hero-status { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.6); padding:5px 12px; border-radius:20px; border:1px solid #333; }
  .avatar { width:36px; height:36px; border-radius:50%; border:2px solid #fff; }
  .hp-bar { width:100px; height:8px; background:#333; border-radius:4px; overflow:hidden; }
  .hp-fill { width:100%; height:100%; background:linear-gradient(90deg, #00ff88, #00cc66); transition:width 0.2s; }
  .enemy-hp { background:linear-gradient(90deg, #ff3366, #cc0033); }
  
  /* 底部控制区 */
  #controls { position:absolute; bottom:20px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 20px; pointer-events:auto; }
  
  /* 虚拟摇杆 */
  .joystick-area { width:120px; height:120px; background:rgba(255,255,255,0.05); border-radius:50%; border:2px solid rgba(255,255,255,0.2); position:relative; display:flex; justify-content:center; align-items:center; }
  .joystick-knob { width:50px; height:50px; background:radial-gradient(circle, #4facfe, #00f2fe); border-radius:50%; position:absolute; box-shadow:0 0 15px #00f2fe; }
  
  /* 技能按钮 */
  .skills { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .skill-btn {
    width:60px; height:60px; border-radius:50%; background:rgba(0,0,0,0.7);
    border:2px solid #00f2fe; color:#fff; font-size:14px; font-weight:bold;
    display:flex; justify-content:center; align-items:center; flex-direction:column;
    box-shadow:0 0 10px rgba(0,242,254,0.4); position:relative; overflow:hidden;
  }
  .skill-btn.active { background:rgba(0,242,254,0.3); border-color:#fff; box-shadow:0 0 20px #00f2fe; }
  .skill-cd { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; font-size:16px; color:#00f2fe; }
  
  /* 英雄选择界面 */
  #heroSelect { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(10,10,20,0.95); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100; pointer-events:auto; }
  #heroSelect h1 { color:#00f2fe; margin-bottom:30px; text-shadow:0 0 20px rgba(0,242,254,0.5); }
  .hero-cards { display:flex; gap:20px; }
  .hero-card { width:100px; height:140px; background:#1a1a2e; border:2px solid #333; border-radius:10px; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; transition:all 0.3s; }
  .hero-card.selected { border-color:#00f2fe; box-shadow:0 0 20px rgba(0,242,254,0.5); transform:scale(1.05); }
  .hero-card img { width:60px; height:60px; border-radius:50%; margin-bottom:10px; background:#333; }
  .hero-card p { color:#fff; font-size:14px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="uiLayer">
  <!-- 顶部血条 -->
  <div class="top-bar">
    <div class="hero-status">
      <div class="avatar" style="background:#4facfe"></div>
      <div>
        <div style="color:#fff; font-size:12px; margin-bottom:2px;" id="playerName">玩家</div>
        <div class="hp-bar"><div class="hp-fill" id="playerHp"></div></div>
      </div>
    </div>
    <div class="hero-status" style="flex-direction:row-reverse;">
      <div class="avatar" style="background:#ff3366"></div>
      <div style="text-align:right;">
        <div style="color:#fff; font-size:12px; margin-bottom:2px;" id="enemyName">敌方</div>
        <div class="hp-bar"><div class="hp-fill enemy-hp" id="enemyHp"></div></div>
      </div>
    </div>
  </div>

  <!-- 底部控制区 -->
  <div id="controls">
    <div class="joystick-area" id="joystickArea">
      <div class="joystick-knob" id="joystickKnob"></div>
    </div>
    <div class="skills">
      <div class="skill-btn" id="btnAtk">普攻</div>
      <div class="skill-btn" id="btnS1">一技能</div>
      <div class="skill-btn" id="btnS2">二技能</div>
      <div class="skill-btn" id="btnUlt">大招</div>
    </div>
  </div>
</div>

<!-- 英雄选择 -->
<div id="heroSelect">
  <h1>选择你的英雄</h1>
  <div class="hero-cards">
    <div class="hero-card selected" data-hero="lixin">
      <div class="avatar" style="background:#ffcc00"></div>
      <p>李信</p>
      <p style="font-size:10px; color:#888;">光暗双形态</p>
    </div>
    <div class="hero-card" data-hero="machao">
      <div class="avatar" style="background:#00f2fe"></div>
      <p>马超</p>
      <p style="font-size:10px; color:#888;">丢枪突刺</p>
    </div>
    <div class="hero-card" data-hero="luna">
      <div class="avatar" style="background:#b366ff"></div>
      <p>露娜</p>
      <p style="font-size:10px; color:#888;">月下无限连</p>
    </div>
  </div>
</div>

<script>
/* =========================================================
   核心游戏引擎 (单文件实现)
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

/* ---------- 工具函数 ---------- */
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function random(min, max) { return Math.random() * (max - min) + min; }

/* =========================================================
   英雄配置
   ========================================================= */
const HERO_CONFIGS = {
  lixin: {
    name: '李信', color: '#ffcc00', hp: 4000, speed: 3.5,
    atkRange: 120, atkSpeed: 800,
    skills: {
      s1: { name: '光/暗切换', cd: 8000 },
      s2: { name: '光信剑气', cd: 6000 },
      ult: { name: '暗信爆发', cd: 15000 }
    }
  },
  machao: {
    name: '马超', color: '#00f2fe', hp: 3500, speed: 4.2,
    atkRange: 100, atkSpeed: 600,
    skills: {
      s1: { name: '丢枪', cd: 4000 },
      s2: { name: '突刺', cd: 3000 },
      ult: { name: '万枪归宗', cd: 12000 }
    }
  },
  luna: {
    name: '露娜', color: '#b366ff', hp: 3200, speed: 3.8,
    atkRange: 150, atkSpeed: 700,
    skills: {
      s1: { name: '弦月斩', cd: 5000 },
      s2: { name: '炙热剑芒', cd: 7000 },
      ult: { name: '新月突击', cd: 8000 }
    }
  }
};

/* =========================================================
   游戏状态
   ========================================================= */
let gameState = {
  running: false,
  selectedHero: 'lixin',
  time: 0,
  particles: [],
  bullets: [],
  spears: [], // 马超的枪
  marks: []   // 露娜的标记
};

let player, enemy;

/* =========================================================
   英雄类
   ========================================================= */
class Hero {
  constructor(isPlayer, heroKey) {
    this.isPlayer = isPlayer;
    this.heroKey = heroKey;
    const cfg = HERO_CONFIGS[heroKey];
    this.name = cfg.name;
    this.color = cfg.color;
    this.maxHp = cfg.hp;
    this.hp = this.maxHp;
    this.speed = cfg.speed;
    this.atkRange = cfg.atkRange;
    this.atkSpeed = cfg.atkSpeed;
    this.x = isPlayer ? 200 : W - 200;
    this.y = H / 2;
    this.radius = 25;
    this.facing = isPlayer ? 0 : Math.PI;
    this.atkTimer = 0;
    this.cd = { s1: 0, s2: 0, ult: 0 };
    this.form = 'light'; // 李信专属形态
    this.hasSpear = false; // 马超捡枪状态
    this.dead = false;
  }

  update(dt, joystick) {
    if (this.dead) return;

    // 冷却减少
    for (let k in this.cd) {
      if (this.cd[k] > 0) this.cd[k] = Math.max(0, this.cd[k] - dt);
    }
    if (this.atkTimer > 0) this.atkTimer -= dt;

    // 移动
    let dx = 0, dy = 0;
    if (this.isPlayer) {
      dx = joystick.dx;
      dy = joystick.dy;
    } else {
      // 简单 AI：朝玩家移动
      if (dist(this, player) > this.atkRange * 0.8) {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        dx = Math.cos(angle);
        dy = Math.sin(angle);
      } else {
        // 攻击玩家
        if (this.atkTimer <= 0) {
          this.attack(player);
        }
        // 随机释放技能
        if (this.cd.s1 <= 0 && Math.random() < 0.02) this.useSkill('s1', player);
        if (this.cd.s2 <= 0 && Math.random() < 0.015) this.useSkill('s2', player);
        if (this.cd.ult <= 0 && Math.random() < 0.01) this.useSkill('ult', player);
      }
    }

    // 边界限制
    const len = Math.hypot(dx, dy);
    if (len > 0.1) {
      dx = (dx / len) * this.speed;
      dy = (dy / len) * this.speed;
      this.x += dx;
      this.y += dy;
      this.facing = Math.atan2(dy, dx);
    }

    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(60 + this.radius, Math.min(H - 140 - this.radius, this.y));
  }

  attack(target) {
    if (this.atkTimer > 0) return;
    this.atkTimer = this.atkSpeed;
    
    // 攻击特效
    gameState.particles.push({ x: this.x, y: this.y, vx: Math.cos(this.facing)*5, vy: Math.sin(this.facing)*5, life: 200, color: this.color, size: 5 });
    
    // 马超强化普攻
    if (this.heroKey === 'machao' && this.hasSpear) {
      this.hasSpear = false;
      // 突刺位移
      this.x += Math.cos(this.facing) * 80;
      this.y += Math.sin(this.facing) * 80;
      if (dist(this, target) < this.atkRange + 40) {
        target.hp -= 400;
      }
    } else {
      if (dist(this, target) < this.atkRange) {
        target.hp -= 150;
      }
    }
    gameState.particles.push({ x: target.x, y: target.y, vx: 0, vy: 0, life: 300, color: '#fff', size: 20, isHit: true });
  }

  useSkill(skillKey, target) {
    if (this.cd[skillKey] > 0) return;
    const cfg = HERO_CONFIGS[this.heroKey].skills[skillKey];
    this.cd[skillKey] = cfg.cd;

    if (this.heroKey === 'lixin') {
      if (skillKey === 's1') {
        this.form = this.form === 'light' ? 'dark' : 'light';
        this.color = this.form === 'light' ? '#ffcc00' : '#cc00ff';
        gameState.particles.push({ x: this.x, y: this.y, vx: 0, vy: 0, life: 500, color: this.color, size: 40 });
      } else if (skillKey === 's2') {
        // 剑气
        gameState.bullets.push({ x: this.x, y: this.y, vx: Math.cos(this.facing)*8, vy: Math.sin(this.facing)*8, damage: 300, range: 400, color: '#ffcc00', owner: this });
      } else if (skillKey === 'ult') {
        // 暗信爆发
        this.hp = Math.min(this.maxHp, this.hp + 800);
        gameState.particles.push({ x: this.x, y: this.y, vx: 0, vy: 0, life: 800, color: '#cc00ff', size: 80 });
        // 范围伤害
        if (dist(this, target) < 200) target.hp -= 600;
      }
    } 
    else if (this.heroKey === 'machao') {
      if (skillKey === 's1') {
        // 丢枪
        const tx = this.x + Math.cos(this.facing) * 300;
        const ty = this.y + Math.sin(this.facing) * 300;
        gameState.spears.push({ x: tx, y: ty, active: true, owner: this });
        gameState.particles.push({ x: this.x, y: this.y, vx: 0, vy: 0, life: 300, color: '#00f2fe', size: 20 });
      } else if (skillKey === 's2') {
        // 突刺
        this.x += Math.cos(this.facing) * 150;
        this.y += Math.sin(this.facing) * 150;
        if (dist(this, target) < this.atkRange + 50) target.hp -= 350;
      } else if (skillKey === 'ult') {
        // 万枪归宗
        for (let i = 0; i < 6; i++) {
          const angle = (i / 6) * Math.PI * 2;
          gameState.spears.push({ x: this.x + Math.cos(angle)*100, y: this.y + Math.sin(angle)*100, active: true, owner: this });
        }
      }
    } 
    else if (this.heroKey === 'luna') {
      if (skillKey === 's1') {
        // 弦月斩
        gameState.bullets.push({ x: this.x, y: this.y, vx: Math.cos(this.facing)*10, vy: Math.sin(this.facing)*10, damage: 250, range: 350, color: '#b366ff', owner: this, isLuna: true });
      } else if (skillKey === 's2') {
        // 炙热剑芒（拉人）
        if (dist(this, target) < 200) {
          const angle = Math.atan2(this.y - target.y, this.x - target.x);
          target.x += Math.cos(angle) * 100;
          target.y += Math.sin(angle) * 100;
          target.hp -= 200;
        }
      } else if (skillKey === 'ult') {
        // 新月突击
        if (dist(this, target) < 300) {
          // 瞬移到目标身后
          this.x = target.x + Math.cos(this.facing + Math.PI) * 50;
          this.y = target.y + Math.sin(this.facing + Math.PI) * 50;
          target.hp -= 500;
          // 如果目标有标记，刷新大招
          if (target.hasLunaMark) {
            this.cd.ult = 0;
            target.hasLunaMark = false;
          }
        }
      }
    }
  }
}

/* =========================================================
   输入处理 (虚拟摇杆 + 技能按钮)
   ========================================================= */
let joystick = { dx: 0, dy: 0, active: false };
const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');
let joystickCenter = { x: 0, y: 0 };

joystickArea.addEventListener('touchstart', (e) => {
  e.preventDefault();
  joystick.active = true;
  const rect = joystickArea.getBoundingClientRect();
  joystickCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
  updateJoystick(e.touches[0]);
});

joystickArea.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!joystick.active) return;
  updateJoystick(e.touches[0]);
});

joystickArea.addEventListener('touchend', () => {
  joystick.active = false;
  joystick.dx = 0; joystick.dy = 0;
  joystickKnob.style.transform = `translate(0px, 0px)`;
});

function updateJoystick(touch) {
  const dx = touch.clientX - joystickCenter.x;
  const dy = touch.clientY - joystickCenter.y;
  const distance = Math.min(Math.hypot(dx, dy), 40);
  const angle = Math.atan2(dy, dx);
  joystick.dx = Math.cos(angle) * (distance / 40);
  joystick.dy = Math.sin(angle) * (distance / 40);
  joystickKnob.style.transform = `translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px)`;
}

/* 鼠标支持 (便于调试) */
canvas.addEventListener('mousemove', (e) => {
  if (!player || player.dead) return;
  // 简单的鼠标跟随测试
});

/* 技能按钮事件 */
function bindSkillBtn(id, skillKey) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!player || player.dead) return;
    if (skillKey === 'atk') {
      player.attack(enemy);
    } else {
      player.useSkill(skillKey, enemy);
    }
    btn.classList.add('active');
    setTimeout(() => btn.classList.remove('active'), 100);
  });
}
bindSkillBtn('btnAtk', 'atk');
bindSkillBtn('btnS1', 's1');
bindSkillBtn('btnS2', 's2');
bindSkillBtn('btnUlt', 'ult');

/* =========================================================
   英雄选择逻辑
   ========================================================= */
document.querySelectorAll('.hero-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    gameState.selectedHero = card.dataset.hero;
  });
});

document.getElementById('heroSelect').addEventListener('touchstart', (e) => {
  const card = e.target.closest('.hero-card');
  if (card) {
    document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    gameState.selectedHero = card.dataset.hero;
  }
  // 双击开始游戏
  if (e.target.id === 'heroSelect' || e.target.tagName === 'H1') {
    startGame();
  }
});

// 双击开始
let lastTap = 0;
document.getElementById('heroSelect').addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 300) {
    startGame();
  }
  lastTap = now;
});

function startGame() {
  const heroSelect = document.getElementById('heroSelect');
  heroSelect.style.display = 'none';
  
  // 随机给敌人分配一个不同的英雄
  const keys = Object.keys(HERO_CONFIGS);
  let enemyHero = gameState.selectedHero;
  while (enemyHero === gameState.selectedHero) {
    enemyHero = keys[Math.floor(Math.random() * keys.length)];
  }
  
  player = new Hero(true, gameState.selectedHero);
  enemy = new Hero(false, enemyHero);
  gameState.running = true;
  
  document.getElementById('playerName').textContent = player.name;
  document.getElementById('enemyName').textContent = enemy.name;
}

/* =========================================================
   游戏主循环
   ========================================================= */
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;

  if (gameState.running) {
    update(dt);
    render();
  } else {
    // 英雄选择界面背景动态效果
    renderBackground(timestamp);
  }
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  gameState.time += dt;
  player.update(dt, joystick);
  enemy.update(dt, { dx: 0, dy: 0 });

  // 检查马超捡枪
  for (let i = gameState.spears.length - 1; i >= 0; i--) {
    const spear = gameState.spears[i];
    if (dist(player, spear) < 40 && spear.owner === player) {
      player.hasSpear = true;
      gameState.spears.splice(i, 1);
      gameState.particles.push({ x: player.x, y: player.y, vx: 0, vy: 0, life: 300, color: '#00f2fe', size: 30 });
    }
  }

  // 子弹更新
  for (let i = gameState.bullets.length - 1; i >= 0; i--) {
    const b = gameState.bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.range -= Math.hypot(b.vx, b.vy);
    
    // 命中检测
    if (dist(b, enemy) < enemy.radius + 10 && b.owner === player) {
      enemy.hp -= b.damage;
      if (b.isLuna) enemy.hasLunaMark = true; // 露娜标记
      gameState.particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 300, color: b.color, size: 30 });
      gameState.bullets.splice(i, 1);
      continue;
    }
    if (dist(b, player) < player.radius + 10 && b.owner === enemy) {
      player.hp -= b.damage;
      if (b.isLuna) player.hasLunaMark = true;
      gameState.particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 300, color: b.color, size: 30 });
      gameState.bullets.splice(i, 1);
      continue;
    }
    if (b.range <= 0) gameState.bullets.splice(i, 1);
  }

  // 粒子效果更新
  for (let i = gameState.particles.length - 1; i >= 0; i--) {
    const p = gameState.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
    if (p.life <= 0) gameState.particles.splice(i, 1);
  }

  // 血量限制
  player.hp = Math.max(0, player.hp);
  enemy.hp = Math.max(0, enemy.hp);

  // 死亡判定
  if (player.hp <= 0 && !player.dead) {
    player.dead = true;
    setTimeout(() => { alert('你阵亡了！点击确定重新开始'); location.reload(); }, 500);
  }
  if (enemy.hp <= 0 && !enemy.dead) {
    enemy.dead = true;
    setTimeout(() => { alert('胜利！你击败了敌方英雄！点击确定重新开始'); location.reload(); }, 500);
  }

  // 更新血条UI
  document.getElementById('playerHp').style.width = `${(player.hp / player.maxHp) * 100}%`;
  document.getElementById('enemyHp').style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;

  // 更新技能冷却UI
  updateSkillCdUI('btnS1', 's1');
  updateSkillCdUI('btnS2', 's2');
  updateSkillCdUI('btnUlt', 'ult');
}

function updateSkillCdUI(btnId, skillKey) {
  const btn = document.getElementById(btnId);
  const cd = player.cd[skillKey];
  if (cd > 0) {
    btn.innerHTML = `${Math.ceil(cd / 1000)}s`;
    btn.style.opacity = '0.5';
  } else {
    const cfg = HERO_CONFIGS[player.heroKey].skills[skillKey];
    btn.innerHTML = cfg.name;
    btn.style.opacity = '1';
  }
}

/* =========================================================
   渲染函数
   ========================================================= */
function renderBackground(time) {
  // 赛博朋克风格深色地图
  const gradient = ctx.createLinearGradient(0, 0, W, H);
  gradient.addColorStop(0, '#0a0a14');
  gradient.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // 中央河道
  ctx.fillStyle = 'rgba(0, 100, 200, 0.1)';
  ctx.fillRect(W/2 - 60, 0, 120, H);
  ctx.strokeStyle = 'rgba(0, 242, 254, 0.3)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2 - 60, 0);
  ctx.lineTo(W/2 - 60, H);
  ctx.moveTo(W/2 + 60, 0);
  ctx.lineTo(W/2 + 60, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // 网格地面
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 草丛效果
  ctx.fillStyle = 'rgba(0, 255, 136, 0.05)';
  ctx.beginPath(); ctx.arc(W/4, H/4, 100, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W*3/4, H*3/4, 100, 0, Math.PI*2); ctx.fill();
}

function render() {
  // 动态背景
  renderBackground(gameState.time);

  // 绘制马超的枪
  for (const spear of gameState.spears) {
    ctx.save();
    ctx.translate(spear.x, spear.y);
    ctx.fillStyle = '#00f2fe';
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(5, 0);
    ctx.lineTo(0, 15);
    ctx.lineTo(-5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowColor = '#00f2fe';
    ctx.shadowBlur = 15;
    ctx.restore();
  }

  // 绘制子弹
  for (const b of gameState.bullets) {
    ctx.save();
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // 绘制标记 (露娜)
  if (enemy.hasLunaMark) {
    ctx.save();
    ctx.strokeStyle = '#b366ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, 40, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // 绘制英雄
  drawHero(player);
  drawHero(enemy);

  // 绘制粒子
  for (const p of gameState.particles) {
    ctx.save();
    ctx.globalAlpha = p.life / 500;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 20;
    if (p.isHit) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life/300), 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawHero(hero) {
  if (hero.dead) return;
  ctx.save();
  ctx.translate(hero.x, hero.y);
  
  // 英雄底部光环
  ctx.fillStyle = hero.color;
  ctx.globalAlpha = 0.2;
  ctx.beginPath();
  ctx.ellipse(0, 10, 35, 15, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // 英雄身体
  ctx.fillStyle = hero.color;
  ctx.shadowColor = hero.color;
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(0, 0, hero.radius, 0, Math.PI*2);
  ctx.fill();

  // 眼睛 (表示朝向)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  const eyeX = Math.cos(hero.facing) * 12;
  const eyeY = Math.sin(hero.facing) * 12;
  ctx.arc(eyeX, eyeY, 5, 0, Math.PI*2);
  ctx.fill();

  // 显示英雄名字
  ctx.fillStyle = '#fff';
  ctx.font = '14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(hero.name, 0, -45);
  
  // 如果有强化状态
  if (hero.heroKey === 'machao' && hero.hasSpear) {
    ctx.fillStyle = '#00f2fe';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('⚡强化', 0, -65);
  }
  if (hero.heroKey === 'lixin' && hero.form === 'dark') {
    ctx.fillStyle = '#cc00ff';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('🌑暗影', 0, -65);
  }

  ctx.restore();
}

/* =========================================================
   启动游戏
   ========================================================= */
requestAnimationFrame(gameLoop);
</script>
